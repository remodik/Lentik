# Пример reverse-proxy для прода (P5).
# Отдаёт security-заголовки для HTML-страниц фронта НАСТОЯЩИМИ заголовками
# (не <meta>), терминирует TLS и проксирует API + WebSocket.
#
# Подставьте свой домен и пути к статике/сертификатам.
# Применяется через nginx.conf-include или cp в /etc/nginx/conf.d/.

# ── Edge rate limiting ───────────────────────────────────────────────────
# Общий бакет по клиентскому IP: сглаживает всплески и защищает от примитивного
# флуда/сканирования на ребре (то, чего не видят app-лимитеры до аутентификации).
# nodelay — сразу отбрасывать сверх нормы, а не ставить в очередь.
limit_req_zone $binary_remote_addr zone=edge_general:10m rate=30r/s;
# Более строгий бакет на auth-эндпоинты (брутфорс PIN/логина).
limit_req_zone $binary_remote_addr zone=edge_auth:10m rate=5r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS редирект ────────────────────────────────────────────────
# Первый запрос по HTTP сразу апгрейдится до HTTPS. HSTS ниже закрепляет это.
server {
    listen 80;
    listen [::]:80;
    server_name lentik.example.com api.lentik.example.com;
    return 301 https://$host$request_uri;
}

# ── Фронтенд ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name lentik.example.com;

    ssl_certificate     /etc/letsencrypt/live/lentik.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lentik.example.com/privkey.pem;

    # ── TLS-харденинг ────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    # Современный набор шифров; TLS 1.3 игнорирует ssl_ciphers, но для 1.2 — фиксируем.
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling — конфиденциальность и быстрый отзыв.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ── Безопасность ответа ──────────────────────────────────────────────
    server_tokens off;            # не светить версию nginx
    client_max_body_size 1m;      # фронт статику отдаёт, тела не принимает

    limit_req zone=edge_general burst=20 nodelay;

    # Security-заголовки для всех ответов фронта.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # CSP: перенесена из <meta> в реальный заголовок. Подставьте origin API/WS.
    # frame-ancestors здесь работает (в <meta> игнорируется браузером).
    add_header Content-Security-Policy "default-src 'self'; \
        script-src 'self' 'unsafe-inline'; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data: https://api.lentik.example.com; \
        media-src 'self' https://api.lentik.example.com; \
        connect-src 'self' https://api.lentik.example.com wss://api.lentik.example.com; \
        object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Статика Next.js (output: export)
    root /srv/lentik/web;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── API + WebSocket (отдельный поддомен) ────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.lentik.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.lentik.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lentik.example.com/privkey.pem;

    # ── TLS-харденинг (как у фронта) ────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    server_tokens off;
    # Кап на тело: чуть выше лимита галереи (50 МБ), чтобы аплоады проходили,
    # но громадные тела отсекались ребром.
    client_max_body_size 60m;

    # Скрываем upstream-заголовки (Server, X-Powered-By), чтобы не светить стек.
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    limit_req zone=edge_general burst=30 nodelay;

    # Defense-in-depth: дублируем базовые заголовки и здесь, чтобы даже если
    # app-middleware (main.py) по какой-то причине не отдал их — ребро всё равно
    # защитит. add_header ... always сохраняет их и на ошибках (4xx/5xx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Строже лимит на auth-эндпоинты (брутфорс PIN/логина на ребре).
    location /auth/ {
        limit_req zone=edge_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (чаты, presence)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
